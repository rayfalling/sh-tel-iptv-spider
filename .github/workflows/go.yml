# 构建与发版
#
# 版本号唯一来源：version.txt（标准语义化版本，如 1.0.13，不带 v 前缀）
#
# 触发方式：
#   push 到 main        → 只跑「代码校验」（gofmt / vet / test），不构建、不发版
#   push tag（v1.0.13） → 校验 + 4 平台构建 + 发布 Release（tag 即发布版本号）
#   workflow_dispatch   → 校验 + 4 平台构建，只上传临时产物，不发版
#
# 发版流程：
#   1. 改 version.txt（例如 1.0.13）并提交，推送到 main
#   2. git tag v1.0.13 && git push origin v1.0.13
#   3. 工作流会校验 tag 与 version.txt 一致，构建时注入 -X main.version=1.0.13，
#      并以 v1.0.13 为 tag 发布 Release
#
# 注意：tag 必须与 version.txt 完全一致（去掉 v 前缀后），否则发版任务会直接失败，
# 避免出现「tag 写的 1.0.14、二进制里是 1.0.13」这种版本漂移。

name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # 代码校验：任何触发方式都会先跑，失败则后面全部不执行
  # ------------------------------------------------------------------
  verify:
    name: 代码校验（gofmt / vet / test）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # 与 go.mod 的 toolchain 声明保持一致，避免额外的工具链下载
          go-version: '1.24.2'

      - name: gofmt / vet / test
        run: |
          # 注意：必须用模块实际使用的 toolchain 自带的 gofmt，
          # PATH 上可能残留旧版本的 gofmt，版本间格式规则有差异会造成假失败。
          GOFMT="$(go env GOROOT)/bin/gofmt"
          echo "🔎 gofmt: $GOFMT ($(go version))"
          unformatted=$("$GOFMT" -l . | grep -v '^$' || true)
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt，请执行 gofmt -w："
            echo "$unformatted"
            exit 1
          fi
          echo "✅ gofmt 通过"

          echo "🔎 go vet"
          go vet ./...

          echo "🔎 go test -short（并发压力测试用 -short 跳过，完整跑请本地 go test ./...）"
          go test -short ./...

  # ------------------------------------------------------------------
  # 构建：仅 tag 推送或手动触发时执行（main 推送不再浪费 4 个平台的构建）
  # ------------------------------------------------------------------
  build:
    name: Build ${{ matrix.target.name }}
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    strategy:
      matrix:
        target:
          # OpenWrt 设备 - aarch64_cortex-a53
          - { goos: linux, goarch: arm64, name: aarch64_cortex-a53, ext: "", platform: "OpenWrt" }
          # OpenWrt 设备 - x86_64
          - { goos: linux, goarch: amd64, name: openwrt_x86_64, ext: "", platform: "OpenWrt" }
          # Linux x86_64 通用版本（适配低版本内核 4.4）
          - { goos: linux, goarch: amd64, name: linux_x86_64, ext: "", platform: "Linux" }
          # Windows - x86_64
          - { goos: windows, goarch: amd64, name: windows_x86_64, ext: ".exe", platform: "Windows" }
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'

      - name: 解析并校验版本号
        id: version
        run: |
          # tag 推送：版本号 = tag 去掉 v 前缀（v1.0.13 → 1.0.13）
          # 手动触发：版本号 = version.txt
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="$(tr -d '\r\n' < version.txt)"
          fi
          VERSION="${VERSION#[vV]}"

          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ 版本号不是标准语义化版本（期望 x.y.z）：$VERSION"
            exit 1
          fi

          FILE_VERSION="$(tr -d '\r\n' < version.txt)"
          FILE_VERSION="${FILE_VERSION#[vV]}"
          if [ "$VERSION" != "$FILE_VERSION" ]; then
            echo "❌ tag/版本号与 version.txt 不一致：tag=$VERSION version.txt=$FILE_VERSION"
            echo "   请先把 version.txt 更新为 $VERSION 并推送到 main，再推 tag。"
            exit 1
          fi

          echo "✅ 版本号 $VERSION（与 version.txt 一致）"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 设置低版本兼容编译环境（Linux 专用）
        if: matrix.target.platform == 'Linux' && matrix.target.goos == 'linux'
        run: |
          echo "🔧 配置低版本内核兼容编译参数"
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build for target
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "🔨 Building for ${{ matrix.target.platform }} - ${{ matrix.target.name }}"
          echo "   GOOS=$GOOS, GOARCH=$GOARCH, VERSION=$VERSION"
          echo "   Go version: $(go version)"

          go mod download

          BINARY_NAME="sh-tel-iptv-spider_${{ matrix.target.name }}${{ matrix.target.ext }}"

          if [ "${{ matrix.target.platform }}" = "Linux" ] && [ "${{ matrix.target.goos }}" = "linux" ]; then
            echo "🐧 使用 musl 进行静态编译，兼容 Linux 内核 4.4+"
            CC=musl-gcc CGO_ENABLED=1 \
            go build -ldflags="-s -w -extldflags '-static' -X main.version=${VERSION}" \
                     -tags "osusergo,netgo,static_build" \
                     -o "$BINARY_NAME" .
          else
            go build -ldflags="-s -w -extldflags '-static' -X main.version=${VERSION}" \
                     -o "$BINARY_NAME" .
          fi

          if [ "${{ matrix.target.goos }}" = "linux" ]; then
            echo "🔍 检查二进制文件依赖:"
            ldd "$BINARY_NAME" 2>&1 || echo "✅ 静态编译，无动态依赖"
            file "$BINARY_NAME"
          fi

          echo "🔍 确认版本号已注入:"
          go version -m "$BINARY_NAME" | grep -E 'ldflags|mod\s' | head -3 || true

          zip "${BINARY_NAME}.zip" "$BINARY_NAME"
          ls -lh *.zip

      - name: Upload artifacts (临时存储)
        uses: actions/upload-artifact@v4
        with:
          name: sh-tel-iptv-spider-${{ matrix.target.name }}
          path: sh-tel-iptv-spider_${{ matrix.target.name }}*.zip
          retention-days: 7
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 发版：仅 tag 推送时执行；tag 本身就是发布版本号
  # ------------------------------------------------------------------
  create-release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 确定版本信息
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#[vV]}"

          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ tag 不是标准语义化版本（期望 vX.Y.Z）：$TAG"
            exit 1
          fi

          FILE_VERSION="$(tr -d '\r\n' < version.txt)"
          FILE_VERSION="${FILE_VERSION#[vV]}"
          if [ "$VERSION" != "$FILE_VERSION" ]; then
            echo "❌ tag 与 version.txt 不一致：tag=$VERSION version.txt=$FILE_VERSION"
            exit 1
          fi

          SHORT_SHA=$(git rev-parse --short HEAD)
          BASE_VERSION=$(git rev-parse --short "$TAG^{commit}" 2>/dev/null || echo "$SHORT_SHA")

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "name=Release ${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "📌 tag=${TAG} version=${VERSION} commit=${SHORT_SHA}（tag 指向 ${BASE_VERSION}）"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: 重组文件结构
        run: |
          echo "📦 原始下载结构:"
          find ./artifacts -type f

          mkdir -p ./release_files
          find ./artifacts -type f -name "*.zip" | while read file; do
            filename=$(basename "$file")
            cp "$file" "./release_files/${filename}"
          done

          echo "📦 重组后的文件:"
          ls -la ./release_files/

          echo "📊 文件大小信息:"
          for file in ./release_files/*; do
            size=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file" 2>/dev/null)
            size_mb=$(echo "scale=2; $size/1024/1024" | bc)
            echo "$(basename $file): ${size_mb} MB"
          done

      - name: Generate release notes
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          SHORT_SHA="${{ steps.version.outputs.sha }}"

          cat > release_notes.md << EOF
          ## 📋 版本信息
          - **版本**: ${TAG}
          - **Commit**: ${SHORT_SHA}
          - **构建时间**: $(date +'%Y-%m-%d %H:%M:%S')
          - **构建分支**: ${GITHUB_REF_NAME}

          ## 📦 包含平台

          ### 🐧 OpenWrt 版本（针对路由器优化）
          - **sh-tel-iptv-spider_aarch64_cortex-a53.zip**: Cortex-A53 64位 ARM 设备（OpenWrt）
          - **sh-tel-iptv-spider_openwrt_x86_64.zip**: x86_64 架构 OpenWrt 设备

          ### 🐧 Linux 通用版本（适配低版本内核）
          - **sh-tel-iptv-spider_linux_x86_64.zip**: Linux x86_64 通用版本
            - ✅ 静态编译，无 glibc 依赖
            - ✅ 兼容 Linux 内核 4.4+
            - ✅ 适用 Ubuntu/CentOS/Debian/Alpine 等

          ### 🪟 Windows 版本
          - **sh-tel-iptv-spider_windows_x86_64.exe.zip**: Windows 64位系统

          ## 🚀 使用方法

          ### Linux 通用版本（内核 4.4+）
          1. 下载 \`sh-tel-iptv-spider_linux_x86_64.zip\`
          2. 解压：\`unzip sh-tel-iptv-spider_linux_x86_64.zip\`
          3. 赋予执行权限：\`chmod +x sh-tel-iptv-spider_linux_x86_64\`
          4. 修改config.yaml配置
          5. 运行程序：\`./sh-tel-iptv-spider_linux_x86_64 -h\`

          ### OpenWrt 设备
          1. 下载对应架构的 zip 文件
          2. 解压：\`unzip sh-tel-iptv-spider_<架构>.zip\`
          3. 上传到设备：\`scp sh-tel-iptv-spider_<架构> root@192.168.1.1:/root/\`
          4. 赋予执行权限：\`chmod +x /root/sh-tel-iptv-spider_<架构>\`
          5. 修改config.yaml配置
          6. 运行程序：\`/root/sh-tel-iptv-spider_<架构> -h\`

          ### Windows
          1. 下载 \`sh-tel-iptv-spider_windows_x86_64.exe.zip\`
          2. 解压到任意目录
          3. 修改config.yaml配置
          4. 运行：\`sh-tel-iptv-spider_windows_x86_64.exe -h\`

          ## ⚠️ 注意事项
          - 所有版本均为静态编译，不依赖外部库
          - Linux 版本使用 musl 静态编译，兼容内核 4.4+
          - 二进制内已注入版本号 ${VERSION}（管理面板 /api/version-check 据此比较）
          - OpenWrt 版本需要能访问上海电信 IPTV 专网
          - 需要配置 MySQL/Sqlite(默认) 数据库连接
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: false
          files: |
            ./release_files/*.zip
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 显示 Release 创建信息
        run: |
          echo "✅ Release 创建成功！"
          echo "🔗 访问地址: https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}"
          echo "📦 上传的文件:"
          ls -la ./release_files/
